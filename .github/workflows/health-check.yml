name: Domain Health Check

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 * * * *' # Hourly automated health check
  workflow_dispatch: # Allows manual trigger

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 1. Check the Arcade (GitHub Pages — nicholai.org)
      - name: Arcade Health Check
        run: |
          curl_exit=0
          status_code=$(curl --connect-timeout 10 --max-time 20 -o /dev/null -s -w "%{http_code}" https://nicholai.org) || curl_exit=$?
          if [ "$curl_exit" -ne 0 ]; then
            case "$curl_exit" in
              6) error_detail="DNS resolution failed" ;;
              7) error_detail="Connection failed" ;;
              28) error_detail="Request timed out" ;;
              *) error_detail="curl failed with exit code $curl_exit" ;;
            esac
            echo "Arcade (nicholai.org) is down! $error_detail."
            exit 1
          fi
          if [ "$status_code" -ne 200 ]; then
            echo "Arcade (nicholai.org) is down! Status: $status_code"
            exit 1
          fi
          echo "nicholai.org OK ($status_code)"

      # 2. Check the Listings (Netlify — amazinggracehomeliving.com)
      - name: Listings Health Check
        run: |
          curl_exit=0
          status_code=$(curl --connect-timeout 10 --max-time 20 -o /dev/null -s -w "%{http_code}" https://amazinggracehomeliving.com) || curl_exit=$?
          if [ "$curl_exit" -ne 0 ]; then
            case "$curl_exit" in
              6) error_detail="DNS resolution failed" ;;
              7) error_detail="Connection failed" ;;
              28) error_detail="Request timed out" ;;
              *) error_detail="curl failed with exit code $curl_exit" ;;
            esac
            echo "Listings (Amazing Grace) is down! $error_detail."
            exit 1
          fi
          if [ "$status_code" -ne 200 ]; then
            echo "Listings (Amazing Grace) is down! Status: $status_code"
            exit 1
          fi
          echo "amazinggracehomeliving.com OK ($status_code)"

      # 3. Check the Voice of Jesus Ministry (voiceofJesusMinistries.com)
      - name: VOJ Ministry Health Check
        run: |
          curl_exit=0
          status_code=$(curl --connect-timeout 10 --max-time 20 -o /dev/null -s -w "%{http_code}" https://voiceofJesusMinistries.com) || curl_exit=$?
          if [ "$curl_exit" -ne 0 ]; then
            case "$curl_exit" in
              6) error_detail="DNS resolution failed" ;;
              7) error_detail="Connection failed" ;;
              28) error_detail="Request timed out" ;;
              *) error_detail="curl failed with exit code $curl_exit" ;;
            esac
            echo "VOJ Ministry (voiceofJesusMinistries.com) is down! $error_detail."
            exit 1
          fi
          if [ "$status_code" -ne 200 ]; then
            echo "VOJ Ministry (voiceofJesusMinistries.com) is down! Status: $status_code"
            exit 1
          fi
          echo "voiceofJesusMinistries.com OK ($status_code)"
